<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<title>تسجيل دخول الموظفين — نظام المكتبة</title>
</head>
<body>
<div class="util-bar">نظام الدخول إلى المكتبة — الجامعة التكنولوجية</div>
<div class="login-shell">
  <div class="card login-card">
    <div class="crest">
      <img src="img/university-crest.png" alt="الجامعة التكنولوجية">
    </div>
    <div class="kicker">دخول الموظفين</div>
    <h1>لوحة تحكم المكتبة</h1>
    <p class="subtitle">سجّل الدخول لعرض التسجيلات والحضور وسجل الزيارات.</p>

    <div id="banner"></div>

    <form id="login-form">
      <label for="password">كلمة المرور</label>
      <input type="password" id="password" autocomplete="current-password" autofocus />

      <div class="btn-row">
        <button type="submit" id="submit-btn">تسجيل الدخول</button>
      </div>
    </form>

    <p class="subtitle" style="margin:16px 0 0;font-size:0.8rem">
      عند إعداد جهاز لوحي جديد؟ <a href="/install-certificate.html" style="color:var(--blue-700);font-weight:700">ثبّت شهادة الأمان هنا</a>
    </p>
  </div>
</div>

<footer class="site-footer"><div class="site-footer-inner"><span>المكتبة المركزية — تأسست عام 1975</span><span>© <span id="footer-year"></span> نظام الدخول إلى المكتبة</span><span>من تطوير Ali Hatim</span></div></footer>
<script src="login.js"></script>
</body>
</html>
